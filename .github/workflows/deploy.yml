# Ships the pushed commit (shared, byte-identical in every unit; contract: DEPLOY-SPEC.md section 9).
#
# `./ops ship` pushes a commit to the `deploy` branch (or dispatches this when the branch is
# already there). Builds the release once per sha12 into s3://<unit>-deploy-<account>/releases/,
# then has the instance tagged deploy-<unit>=true run deploy/activate.sh over SSM. Everything
# unit-specific comes from deploy/ops.env; the account id from the repo variable AWS_ACCOUNT_ID.
name: deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 75
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - name: Check the account id
        run: |
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::repository variable AWS_ACCOUNT_ID is not a 12-digit account id"; exit 1; }
          echo "::add-mask::$AWS_ACCOUNT_ID"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read deploy/ops.env
        run: |
          set -a
          . deploy/ops.env
          set +a
          SHA12="${GITHUB_SHA:0:12}"
          {
            echo "UNIT=$UNIT"
            echo "REGION=$REGION"
            echo "SHIP_ROLE=$SHIP_ROLE"
            echo "NODE_VERSION=$NODE_VERSION"
            echo "SHA12=$SHA12"
            echo "BUCKET=$UNIT-deploy-$AWS_ACCOUNT_ID"
          } >> "$GITHUB_ENV"

      - name: Node
        if: env.NODE_VERSION != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.UNIT }}-github-deploy
          role-session-name: ${{ env.UNIT }}-deploy-${{ github.run_id }}
          aws-region: ${{ env.REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Build or reuse the release
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          BUILD_SSH_KEY: ${{ secrets.BUILD_SSH_KEY }}
        run: |
          key="releases/$SHA12.tar.gz"
          mkdir -p out
          if aws s3api head-object --bucket "$BUCKET" --key "$key.sha256" >/dev/null 2>&1; then
            aws s3 cp "s3://$BUCKET/$key" "out/$SHA12.tar.gz" --only-show-errors
            aws s3 cp "s3://$BUCKET/$key.sha256" "out/$SHA12.tar.gz.sha256" --only-show-errors
            ( cd out && sha256sum -c "$SHA12.tar.gz.sha256" )
            echo "BUILT=reused" >> "$GITHUB_ENV"
          else
            deploy/build.sh "$SHA12" out
            [[ -f "out/$SHA12.tar.gz" ]] || { echo "::error::deploy/build.sh did not write out/$SHA12.tar.gz"; exit 1; }
            ( cd out && sha256sum "$SHA12.tar.gz" > "$SHA12.tar.gz.sha256" )
            # The .sha256 last: its presence means the tarball is complete.
            aws s3 cp "out/$SHA12.tar.gz" "s3://$BUCKET/$key" --only-show-errors
            aws s3 cp "out/$SHA12.tar.gz.sha256" "s3://$BUCKET/$key.sha256" --only-show-errors
            echo "BUILT=built" >> "$GITHUB_ENV"
          fi

      - name: Precheck
        run: |
          if [[ -f deploy/precheck.sh ]]; then
            bash deploy/precheck.sh "$SHA12" "out/$SHA12.tar.gz"
          else
            echo "no deploy/precheck.sh"
          fi

      - name: Find the instance
        run: |
          ids="$(aws ssm describe-instance-information \
            --filters "Key=tag:deploy-$UNIT,Values=true" "Key=PingStatus,Values=Online" \
            --query 'InstanceInformationList[].InstanceId' --output text)"
          read -ra found <<< "$ids"
          if (( ${#found[@]} == 0 )); then echo "::error::no online instance tagged deploy-$UNIT=true"; exit 1; fi
          if (( ${#found[@]} > 1 )); then echo "::error::more than one online instance tagged deploy-$UNIT=true: ${found[*]}"; exit 1; fi
          echo "INSTANCE_ID=${found[0]}" >> "$GITHUB_ENV"

      - name: Activate
        run: |
          tarball="/var/tmp/$UNIT-$SHA12.tar.gz"
          script="/var/tmp/$UNIT-activate.sh"
          params="$(jq -cn \
            --arg get "aws s3 cp s3://$BUCKET/releases/$SHA12.tar.gz $tarball --region $REGION --only-show-errors" \
            --arg extract "{ tar -xzOf $tarball deploy/activate.sh 2>/dev/null || tar -xzOf $tarball ./deploy/activate.sh; } > $script" \
            --arg clean "rm -f $tarball" \
            --arg run "bash $script $SHA12 $BUCKET $SHIP_ROLE" \
            '{commands: ["set -eo pipefail", $get, $extract, $clean, $run], executionTimeout: ["3600"]}')"
          cmd_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --timeout-seconds 3600 \
            --comment "$UNIT $SHA12" --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "command $cmd_id on the instance"
          status=Pending
          for _ in $(seq 1 450); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --output json > invocation.json
          code="$(jq -r '.ResponseCode' invocation.json)"
          echo "::group::stdout (last 200 lines)"; jq -r '.StandardOutputContent' invocation.json | tail -n 200; echo "::endgroup::"
          echo "::group::stderr (last 200 lines)"; jq -r '.StandardErrorContent' invocation.json | tail -n 200; echo "::endgroup::"
          echo "status $status, exit $code"
          if [[ "$status" == Success ]]; then
            echo "OUTCOME=live" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$status" == Failed && "$code" == 2 ]]; then
            previous="$(jq -r '.StandardOutputContent' invocation.json | grep -o 'reverted to [0-9a-zA-Z]*' | tail -n 1 | cut -d' ' -f3)"
            echo "OUTCOME=reverted to ${previous:-the previous release}" >> "$GITHUB_ENV"
            echo "::error::health check failed; reverted to ${previous:-the previous release}"
            exit 1
          fi
          echo "OUTCOME=failed ($status, exit $code)" >> "$GITHUB_ENV"
          echo "::error::activation failed: $status, exit $code"
          exit 1

      - name: Record the live release
        run: aws ssm put-parameter --name "/$UNIT/release" --type String --value "$SHA12" --overwrite >/dev/null

      - name: Prune the bucket
        run: |
          # Releases named by sha12 only: objects from before this pipeline are left to the owner.
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix releases/ \
            --query 'Contents[].[LastModified,Key]' --output text \
          | awk '$2 ~ /^releases\/[0-9a-f]{12}\.tar\.gz$/' | sort -r | awk '{print $2}' > releases.txt
          n=0
          while read -r key; do
            sha="${key#releases/}"; sha="${sha%.tar.gz}"
            n=$((n + 1))
            (( n <= 3 )) && continue
            [[ "$sha" == "$SHA12" ]] && continue
            echo "deleting $sha"
            aws s3 rm "s3://$BUCKET/$key" --only-show-errors
            aws s3 rm "s3://$BUCKET/$key.sha256" --only-show-errors
          done < releases.txt

      - name: Summary
        if: always()
        run: |
          line="${UNIT:-?} ${SHA12:-?}: ${BUILT:-not built}, ${OUTCOME:-did not activate}"
          echo "::notice title=deploy::$line"
          {
            echo "### deploy"
            echo "| unit | sha12 | release | outcome |"
            echo "|---|---|---|---|"
            echo "| ${UNIT:-?} | \`${SHA12:-?}\` | ${BUILT:-not built} | ${OUTCOME:-did not activate} |"
          } >> "$GITHUB_STEP_SUMMARY"
